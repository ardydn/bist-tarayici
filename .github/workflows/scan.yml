name: bist-rsi-tarayici

on:
  schedule:
    # Saatte bir, her saatin 16. dakikasinda (TradingView verisi ~15 dk gecikmeli). #deneme
    # 07:16-15:16 UTC = 10:16-18:16 TSI, hafta ici
    - cron: "16 7-15 * * 1-5"
  workflow_dispatch:
    inputs:
      test:
        description: "Telegram test mesaji da gonder"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Paketleri kur
        run: pip install -r requirements.txt

      - name: Tara
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TEST_FLAG: ${{ github.event_name == 'workflow_dispatch' && inputs.test && '--test' || '' }}
        run: python scanner.py $TEST_FLAG

      - name: Durum dosyasini kaydet
        run: |
          git config user.name "scanner-bot"
          git config user.email "scanner-bot@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || (git commit -m "state" && git push)
