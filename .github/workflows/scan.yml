name: bist-rsi-tarayici

# Zamanlama GitHub'da degil, cron-job.org'da (hafta ici 10:16-18:16, Europe/Istanbul).
# cron-job.org bu workflow'u workflow_dispatch API'siyle tetikler.
on:
  workflow_dispatch:
    inputs:
      test:
        description: "Telegram test mesaji da gonder"
        type: boolean
        default: false
      summary:
        description: "Gun ozetini simdi gonder (test)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Paketleri kur
        run: pip install -r requirements.txt

      - name: Tara
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_TEST: ${{ github.event_name == 'workflow_dispatch' && inputs.test }}
          RUN_SUMMARY: ${{ github.event_name == 'workflow_dispatch' && inputs.summary }}
        run: python scanner.py

      - name: Durum dosyasini kaydet
        run: |
          git config user.name "scanner-bot"
          git config user.email "scanner-bot@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || (git commit -m "state" && git push)
